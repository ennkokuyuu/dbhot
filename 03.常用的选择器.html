<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>常用的选择器</title>
		<style type="text/css">
		/*为页面中所有的P元素设置一个字体颜色为红色*/
		/*
		 元素选择器
		  -通过元素选择器，可以选中页面中的所有指定元素。
		  语法:{}
		 * */
			p{
				color: green;
			}
			/*
			 id选择器：
			 	通过元素的id属性值选中唯一的一个元素
			 	语法:#id属性值
			 */
			#p1{
				font-size: 10px;
			}
			
			/*
			 类选择器
			 	通过元素的class属性值选中一组元素
			 	语法：
			 	  .class属性值{}
			 * */
			.p2{
				color: yellow;
			}
			
			/*
			 为id为p1的元素，class为p2的元素，还有h1,同时设置一个背景颜色为黄色
			 * */
			/*
			 选择器分组：通过选择器分组可以同时选中多个选择器对应的元素
			 语法:选择器1,选择器2,选择器n{}
			 */
			#p1,.p2,h1{
				color: green;
			}
			
			/*
			 通配选择器：
			 	可以用来选择页面中的所有元素
			 	语法：*{}
			 * */
			
			/*
			 为拥有class p3 span元素设置一个背景颜色为黄色
			 复合选择器：同时满足多个选择器的元素
			 语法：选择器1选择器2选择器n{}
			 * */
			span.p3{
				background-color: salmon;
			}
		</style>
	</head>
	<body>
		<h1>名弄</h1>
		<p>锄禾日当午</p>
		<p>锄禾日当午</p>
		<p id="p1">锄禾日当午</p>
		<!--我们可以为元素设置class属性，calss属性和id属性类似，只不过clss属性可以重复
			，拥有相同clss属性值的元素，我们说他们是一组元素。可以同时为一个元素设置多个class属性值，多个值中间用空格隔开
		-->
		<p class="p2 hello">锄禾日当午</p>
		<p class="p2">锄禾日当午</p>
		<p class="p2">锄禾日当午</p>
		<p>锄禾日当午</p>
		
		<p clss="p3">汗滴禾下土</p>
		<span class="p3">汗滴禾下土</span>
	</body>
</html>
